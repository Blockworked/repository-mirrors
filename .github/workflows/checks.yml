name: Checks

on:
  push:
    paths:
      - 'mirror.py'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'mirror.py'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
